<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>BudFin · IIT Roorkee</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);--bg:#cfeeff;--card:rgba(255,255,255,.9);--row:#fff6d6;--tx:#2b2a33;--mu:#6b6a78;--ac:#d9480f;--bd:#f3dd9a;--sh:0 4px 14px rgba(214,150,20,.22);--ok:#2f9e44;--bad:#e03131;--in:#fffdf2}
*{box-sizing:border-box}html,body{margin:0}
body{background:linear-gradient(180deg,#7ccfff 0%,#c9ecff 38%,#fff0b8 80%,#ffe08a 100%) fixed;color:var(--tx);font:15px/1.4 system-ui,sans-serif;min-height:100vh;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));position:relative;overflow-x:hidden}
.bl{position:fixed;z-index:0;border-radius:50%;filter:blur(2px)}
.b1{width:300px;height:300px;right:-70px;top:-70px;background:radial-gradient(circle at 40% 40%,#fffbd0,#ffd43b 55%,#ffb703);box-shadow:0 0 90px 45px rgba(255,214,60,.6)}
.b2{width:460px;height:150px;left:-140px;bottom:50px;background:#fff;opacity:.85;filter:blur(16px)}
.phone{position:relative;z-index:1;max-width:430px;margin:auto;background:var(--card);border-radius:30px;padding:20px 18px 26px;min-height:calc(100vh - 28px);backdrop-filter:blur(6px);box-shadow:0 18px 50px rgba(255,170,0,.28)}
h1{font-size:30px;margin:18px 0 14px;font-weight:600}h2{font-size:14px;margin:22px 0 10px;font-weight:500;color:var(--mu)}
.search{position:relative}.search input{padding:11px 38px 11px 14px;border-radius:12px;border:0;background:var(--in);box-shadow:var(--sh);font-size:13px}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mu)}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;margin:5px 0}
.free{display:flex;align-items:center;justify-content:space-between;background:var(--in);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.sw{width:46px;height:26px;border-radius:99px;background:var(--bd);position:relative;border:0;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on:after{left:23px}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;font-size:11px;color:var(--mu)}
.q button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
.q i{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:18px;color:#fff;margin-bottom:7px;box-shadow:var(--sh)}
.fav{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}.fav button{border:0;background:none;color:var(--mu);font-size:10px;text-align:center;cursor:pointer;min-width:58px}
.av{width:50px;height:50px;border-radius:50%;background:var(--in);display:grid;place-items:center;font-size:25px;position:relative;margin:0 auto 4px;border:2px solid var(--bd)}
.av u{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;border:2px solid var(--card);background:var(--mu)}.av u.g{background:var(--ok)}
.grp{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}.grp>b{width:16px;color:var(--ac);font-size:18px;padding-top:12px}
.rows{flex:1}.rw{display:flex;gap:10px;align-items:center;background:var(--row);border-radius:14px;padding:9px 12px;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer}
.rw .av{margin:0;width:38px;height:38px;font-size:19px}.rw small{display:block;color:var(--mu);font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu);flex:none}.dot.g{background:var(--ok)}
.fab{position:fixed;right:max(16px,calc(50% - 205px));bottom:90px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffb703,#ff7a00);color:#fff;display:grid;place-items:center;font-size:18px;z-index:3;box-shadow:var(--sh)}
.bk{border:0;background:none;color:var(--tx);font:inherit;font-size:22px;font-weight:600;cursor:pointer;padding:0;margin:14px 0}
.card{background:var(--row);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}
.chip{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag{background:var(--in);color:var(--ac);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600}
button.p,button.s{border-radius:99px;padding:8px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--ac)}
button.p{background:var(--ac);color:#fff}button.s{background:none;color:var(--ac)}button.d{border-color:var(--bad);color:var(--bad)}
.msg{padding:8px 12px;border-radius:14px;margin:5px 0;max-width:85%}.me{background:var(--ac);color:#fff;margin-left:auto}.bt{background:var(--in)}
.ov{position:fixed;inset:0;background:#0006;z-index:6;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:430px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.chat{position:fixed;inset:0;background:var(--card);z-index:5;max-width:430px;margin:auto;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:var(--card);padding:10px 16px;border-radius:99px;font-size:14px;z-index:9}
.rep{margin:8px 0 0 12px;border-left:3px solid var(--bd);padding:2px 10px}.mt{background:#e6f7ea;border-radius:12px;padding:8px 10px;margin-top:8px;font-size:13px}.cd{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #0003;vertical-align:-1px}.msg small{font-size:10px}.tag.lv{color:var(--ok)}.rw small{margin-top:1px}</style></head><body>
<div class="bl b1"></div><div class="bl b2"></div>
<div class="phone" id="app"></div>
<script>
const PURP=['Chill','Study','Gym','Build','Music','Food'];
const IC={search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
heart:'<path d="M12 20s-8-4.7-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.3 12 20 12 20z"/>',
bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
mega:'<path d="M4 10v4h3l7 4V6L7 10H4zM17 9a4 4 0 0 1 0 6"/>',
gear:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
chat:'<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4A8 8 0 1 1 20 12z"/>'};
const ic=(n,s=26)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const QA=[['match','heart','Matches','linear-gradient(135deg,#ffb703,#fb8500)'],['ideas','bulb','Ideas','linear-gradient(135deg,#4dabf7,#1c7ed6)'],['lf','mega','Lost &amp; Found','linear-gradient(135deg,#51cf66,#2f9e44)'],['buddy','chat','AI buddy','linear-gradient(135deg,#ff8fab,#f06595)']];
const NEAR=500,H=36e5;
const CATS=['Bottle','ID card','Phone','Bag','Keys','Earphones','Wallet','Laptop/Charger','Clothing','Other'],COLS=['Black','White','Blue','Red','Green','Yellow','Grey','Brown','Pink','Orange','Purple'],SZ=['Small','Medium','Large'],LOCS=['Cautley Library','Main Building','Canteen / Chai point','Sports ground','Ganga Canal bank','Hostel area','Lecture halls','Other'];
const COLH={Black:'#222',White:'#fff',Blue:'#2f7de1',Red:'#e03131',Green:'#2f9e44',Yellow:'#fcc419',Grey:'#868e96',Brown:'#8d5524',Pink:'#f783ac',Orange:'#fd7e14',Purple:'#7950f2'};
const $=s=>document.querySelector(s);
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wd=s=>new Set((s||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.includes(w)));
const STOP='the a an and with near has have for from was were this that it its in on at of to is'.split(' ');
function lfScore(a,b){if(a.k==b.k||a.cat!=b.cat)return 0;let s=10;if(a.col==b.col)s+=25;if(a.sz==b.sz)s+=10;const x=a.br.toLowerCase().trim(),y=b.br.toLowerCase().trim();if(x&&y&&(x.includes(y)||y.includes(x)))s+=15;if(a.loc==b.loc)s+=15;const h=Math.abs(a.ts-b.ts)/H;s+=h<=24?10:h<=72?5:0;const p=wd(a.d),q=wd(b.d),n=[...p].filter(w=>q.has(w)).length,u=new Set([...p,...q]).size;if(u)s+=Math.round(15*n/u);return s}
function ago(t){const m=Math.max(0,Math.round((Date.now()-t)/6e4));return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'}
function modal(h){cl();const o=document.createElement('div');o.id='md';o.className='ov';o.innerHTML=`<div class="sheet">${h}</div>`;o.onclick=e=>{if(e.target==o)cl()};document.body.append(o)}
function cl(){const o=$('#md');if(o)o.remove()}
let DB,UID,EMAIL='',ADMIN=false,SM=null,READY=0,MADE=0,cu=null,lfInit=0,dirty=0;
const D={g:[],m:[],p:{},i:[],ii:[],r:[],lf:[],mt:[],rp:[],cfg:{},cm:[]};
const S={tab:'home',q:'',pf:'',io:null,purp:'Chill',mi:['chai','anime'],notif:1,hid:[],blk:[],loc:null,lm:'',bot:[{t:'Hey! Tell me your mood or what you want to do.'}]};
try{Object.assign(S,JSON.parse(localStorage.getItem('bf5')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('bf5',JSON.stringify({mi:S.mi,purp:S.purp,hid:S.hid,blk:S.blk,notif:S.notif}))}catch(e){}};
const me=()=>D.p[UID]||{al:'…',em:'🙂'},al=u=>u=='seed'?'BudFin Team':(D.p[u]||{}).al||'Someone',emo=u=>(D.p[u]||{}).em||'🙂';
const VER=()=>/@([a-z0-9-]+\.)*iitr\.ac\.in$/i.test(EMAIL);
const mem=g=>D.m.filter(x=>x.g==g),joined=g=>D.m.some(x=>x.g==g&&x.u==UID);
const setP=o=>DB.doc('profiles/'+UID).update(o).catch(()=>toast('Could not save'));
const km=(a,b,c,d)=>{const r=Math.PI/180,h=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const TT={match:'Matches',ideas:'Ideas',lf:'Lost &amp; Found',buddy:'AI buddy',me:'Profile',settings:'Settings'};
const R=()=>render(1),go=t=>{S.tab=t;R();window.scrollTo(0,0)};
function render(f){const a=document.activeElement;if(!f&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a)){dirty=1;return}dirty=0;
 $('#app').innerHTML=READY?(S.tab=='home'?'':`<button class="bk" onclick="go('home')">‹ ${TT[S.tab]}</button>`)+V[S.tab]():'<p class="mu" style="margin-top:40vh;text-align:center">Connecting to BudFin…</p>'}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty)render()},60));
const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));
function sub(c,fn){DB.collection(c).onSnapshot(s=>{fn(s);render()},e=>toast('Sync issue: '+e.message))}
async function init(){let m0;try{m0=await API('me')}catch(e){return loginUI()}
DB=mkDB();UID=m0.id;EMAIL=m0.email;ADMIN=!!m0.admin;SM=p=>API('ai',{prompt:p});
 sub('profiles',s=>{D.p={};rows(s).forEach(x=>D.p[x.id]=x);if(!D.p[UID]&&!MADE){MADE=1;DB.doc('profiles/'+UID).set({al:'Newbie_'+(100+Math.floor(Math.random()*900)),em:'🙂',ready:0,int:S.mi,p:S.purp})}});
 sub('groups',s=>D.g=rows(s));sub('members',s=>D.m=rows(s));sub('ideas',s=>D.i=rows(s));sub('ideaIn',s=>D.ii=rows(s));sub('replies',s=>D.r=rows(s));
 sub('meetups',s=>D.mt=rows(s));sub('reports',s=>D.rp=rows(s));sub('config',s=>D.cfg=rows(s).find(x=>x.id=='main')||{});
 sub('lf',s=>{const nw=lfInit?s.docChanges().filter(c=>c.type=='added').map(c=>({id:c.doc.id,...c.doc.data()})):[];D.lf=rows(s);lfInit=1;
  if(S.notif)nw.forEach(n=>{if(n.by!=UID&&D.lf.some(x=>x.by==UID&&!x.done&&lfScore(x,n)>=45))toast('New possible match for your '+(n.k=='found'?'lost':'found')+' item!')})});
 READY=1;R()}
function gate(m){if(D.cfg.requireIITR&&EMAIL&&!VER()){go('me');toast('Verify with an @iitr.ac.in account to '+m);return 0}return 1}
const V={
home(){const mine=D.g.filter(g=>joined(g.id));return `<div class="search"><input placeholder="Search groups, activities, interests" value="${esc(S.q)}" oninput="filt(this.value)">${ic('search',17)}</div>
 <div class="row" style="justify-content:space-between"><h1>Groups</h1><button class="s" aria-label="Settings" onclick="go('settings')" style="padding:8px 10px;display:grid">${ic('gear',20)}</button></div>
 <div class="free"><div><b>Free to chill?</b><div class="mu">${me().ready?'Visible within 500 m (alias only)':'Tap to show you’re ready to meet'}</div></div><button class="sw ${me().ready?'on':''}" aria-label="Ready to meet" onclick="toggleReady()"></button></div>
 <div class="q">${QA.map(a=>`<button onclick="go('${a[0]}')"><i style="background:${a[3]}">${ic(a[1],28)}</i>${a[2]}</button>`).join('')}</div>
 <h2>My groups</h2><div class="fav">${mine.map(g=>`<button onclick="gprof('${g.id}')"><div class="av">${g.em}<u class="${g.live?'g':''}"></u></div>${esc(g.n.split(' ')[0])}</button>`).join('')||'<span class="mu" style="align-self:center">Join a group below.</span>'}
 <button onclick="go('me')"><div class="av" style="font-size:18px">${me().em}<u class="${VER()?'g':''}"></u></div>${VER()?'Verified':'Profile'}</button></div>
 <h2 class="row" style="justify-content:space-between">Groups with activity <button class="p" onclick="cg()">+ Create</button></h2><div class="row" style="margin-bottom:12px">${PURP.map(p=>`<span class="chip ${S.pf==p?'on':''}" onclick="S.pf=S.pf=='${p}'?'':'${p}';R()">${p}</span>`).join('')}</div><div id="lst">${listHtml()}</div>`},
match(){const near=Object.entries(D.p).filter(([u,p])=>u!=UID&&!S.blk.includes(u)&&p.ready&&p.lat!=null&&S.loc&&Date.now()-(p.seen||0)<108e5).map(([u,p])=>({u,p,d:km(S.loc.lat,S.loc.lng,p.lat,p.lng)*1000})).filter(x=>x.d<=NEAR).map(x=>({...x,sh:(x.p.int||[]).filter(i=>S.mi.includes(i))})).sort((a,b)=>(b.sh.length*2+(b.p.p==S.purp?3:0))-(a.sh.length*2+(a.p.p==S.purp?3:0)));
 return `<div class="card"><b>Your purpose</b><div class="row" style="margin:10px 0">${PURP.map(p=>`<span class="chip ${S.purp==p?'on':''}" onclick="S.purp='${p}';sv();setP({p:'${p}'});R()">${p}</span>`).join('')}</div>
 <b>Your interests</b><input placeholder="Add an interest, press Enter" onkeydown="if(event.key=='Enter'&&this.value.trim()){S.mi.push(this.value.trim().toLowerCase());sv();setP({int:S.mi});R()}">
 <div class="row">${S.mi.map((i,x)=>`<span class="chip on" onclick="S.mi.splice(${x},1);sv();setP({int:S.mi});R()">${esc(i)} ✕</span>`).join('')}</div></div>
 <div class="mu" style="margin-bottom:8px">📍 People who are free within 500 m of you</div>${S.loc?'':'<button class="p" onclick="getLoc(()=>{R()})">Use my location</button>'}
 ${near.map(x=>`<div class="card row" style="justify-content:space-between"><div class="row"><div class="av" style="margin:0">${x.p.em||'🙂'}</div><div><b>${esc(x.p.al)}</b><div class="mu">${x.p.p==S.purp?'Same purpose · ':''}${x.sh.length} shared · ~${Math.max(50,Math.round(x.d/50)*50)} m away</div></div></div><div class="row"><button class="p" onclick="dm('${x.u}')">Chat</button><button class="s d" onclick="rep('user','${x.u}')">Report</button></div></div>`).join('')||(S.loc?'<p class="mu">Nobody free within 500 m right now. Turn on “Free to chill?” so others can find you too.</p>':'')}`},
ideas(){return `<div class="card"><input id="it" placeholder="Idea title"><textarea id="ib" rows="2" placeholder="Describe it so others can jump in…"></textarea><button class="p" onclick="addIdea()">Start discussion</button></div>
 ${[...D.i].sort((a,b)=>b.ts-a.ts).map(x=>{const o=S.io==x.id,jn=D.ii.some(y=>y.i==x.id&&y.u==UID),rs=D.r.filter(r=>r.i==x.id).sort((a,b)=>a.ts-b.ts);return `<div class="card"><b>${esc(x.t)}</b><div class="mu">by ${esc(al(x.by))} · ${ago(x.ts)} · ${D.ii.filter(y=>y.i==x.id).length} in</div>${x.b?`<p style="margin:8px 0">${esc(x.b)}</p>`:''}
 <div class="row"><button class="s" onclick="S.io=${o?'null':`'${x.id}'`};R()">💬 ${rs.length} ${rs.length==1?'reply':'replies'}</button><button class="${jn?'s':'p'}" onclick="joinI('${x.id}')">${jn?'Leave':'I’m in'}</button>${x.by==UID||ADMIN?`<button class="s d" onclick="DB.doc('ideas/${x.id}').delete()">Delete</button>`:''}</div>
 ${o?`${rs.map(r=>`<div class="rep"><b>${esc(al(r.by))}</b> <span class="mu">${ago(r.ts)}</span><div>${r.to?`<span class="mu">↩ @${esc(al(r.to))}</span> `:''}${esc(r.t)}</div><button class="s" style="padding:2px 10px;font-size:11px;margin-top:4px" onclick="rto('${r.by}')">Reply</button></div>`).join('')||'<p class="mu">No replies yet. Start the conversation.</p>'}
 <div class="row" style="flex-wrap:nowrap;margin-top:8px"><input id="ri" placeholder="Write a reply…" onkeydown="if(event.key=='Enter')addRep('${x.id}')"><button class="p" onclick="addRep('${x.id}')">Send</button></div>`:''}</div>`}).join('')||'<p class="mu">No ideas yet. Post the first one.</p>'}`},
lf(){const op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join(''),L=D.lf.filter(x=>!x.done).sort((a,b)=>((b.by==UID)-(a.by==UID))||b.ts-a.ts);return `<div class="card"><b>Report an item</b>
 <select id="lk"><option value="lost">I lost something</option><option value="found">I found something</option></select>
 <div class="row" style="flex-wrap:nowrap"><select id="lc">${op(CATS)}</select><select id="lo">${op(COLS)}</select></div>
 <div class="row" style="flex-wrap:nowrap"><select id="lz">${op(SZ,'Medium')}</select><input id="lb" placeholder="Brand (optional)"></div>
 <select id="ll">${op(LOCS)}</select><input id="ld" type="datetime-local"><textarea id="lt" rows="2" placeholder="Marks, stickers, dents, contents…"></textarea>
 <button class="p" onclick="addLf()">Post &amp; find matches</button></div>
 ${L.map(x=>{const mine=x.by==UID,m=mine?lfMatch(x):[];return `<div class="card"><div class="row"><span class="tag">${x.k}</span><b>${x.cat}</b><span class="mu"><i class="cd" style="background:${COLH[x.col]}"></i> ${x.col} · ${x.sz}${x.br?' · '+esc(x.br):''}</span></div><div class="mu" style="margin-top:4px">📍 ${x.loc} · ${ago(x.ts)} · ${esc(al(x.by))}</div>${x.d?`<div style="margin-top:4px">${esc(x.d)}</div>`:''}
 ${mine?(m.length?m.map(y=>`<div class="mt"><b>${y.s}% match</b> · ${y.o.k} ${y.o.cat}, ${y.o.col}, ${y.o.loc}<br><button class="p" style="margin-top:6px;padding:4px 12px" onclick="${y.o.by=='seed'?"toast('Demo item')":`dm('${y.o.by}')`}">Contact ${esc(al(y.o.by))}</button></div>`).join(''):'<div class="mu" style="margin-top:6px">No matches yet. You’ll be notified when one is posted.</div>')+`<button class="s" style="margin:8px 6px 0 0;padding:4px 12px" onclick="DB.doc('lf/${x.id}').update({done:1})">Mark resolved</button><button class="s d" style="margin-top:8px;padding:4px 12px" onclick="DB.doc('lf/${x.id}').delete()">Remove</button>`:(ADMIN?`<button class="s d" style="margin-top:8px;padding:4px 12px" onclick="DB.doc('lf/${x.id}').delete()">Remove</button>`:'')}</div>`}).join('')}`},
buddy(){return `<div class="row" style="margin-bottom:10px">${['bored','hungry','study','idea'].map(w=>`<span class="chip" onclick="$('#bi').value='I feel ${w}';bot()">${w}</span>`).join('')}</div><div class="card" id="bl">${botHtml()}</div><input id="bi" placeholder="Tell me how you feel…" onkeydown="if(event.key=='Enter')bot()">`},
